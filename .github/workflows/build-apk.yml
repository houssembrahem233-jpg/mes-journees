name: Construire l'APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Créer le projet Expo et y copier l'application
        run: |
          npx --yes create-expo-app@latest build --template blank
          cp App.js build/
          cp -r src build/
          cd build
          npx expo install @react-native-async-storage/async-storage react-native-safe-area-context @expo/vector-icons expo-status-bar
          node -e "
            const fs = require('fs');
            const j = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            j.expo.name = 'Mes Journées';
            j.expo.slug = 'mes-journees';
            j.expo.orientation = 'portrait';
            j.expo.android = Object.assign({}, j.expo.android, { package: 'com.mesjournees.app' });
            fs.writeFileSync('app.json', JSON.stringify(j, null, 2));
          "

      - name: Générer le projet Android
        working-directory: build
        env:
          CI: 1
        run: npx expo prebuild --platform android

      - name: Compiler l'APK
        working-directory: build/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Publier l'APK (onglet Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Mes Journées — version ${{ github.run_number }}
          body: Télécharge le fichier app-release.apk sur ton téléphone Android et ouvre-le pour l'installer.
          files: build/android/app/build/outputs/apk/release/app-release.apk
